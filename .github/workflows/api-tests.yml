name: BIIS API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biis_test
          POSTGRES_PASSWORD: biis_test_pass
          POSTGRES_DB: biis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biis_test:biis_test_pass@localhost:5432/biis_test
      SESSION_SECRET: ci-test-secret
      PORT: 5001
      NODE_ENV: test
      DB_SSL: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Run database migrations & seed
        working-directory: server
        run: node src/migrate.js

      - name: Start server & wait for health
        working-directory: server
        run: |
          node src/index.js &
          echo "Waiting for server..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5001/api/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "  attempt $i..."
            sleep 2
          done
          curl -f http://localhost:5001/api/health || (echo "Server failed to start" && exit 1)

      - name: Run API tests
        run: node server/tests/api.test.js
